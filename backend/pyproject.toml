[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socratic-backend"
version = "0.5.0"
description = "Socratic learning API (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "email-validator>=2.1",
  "httpx>=0.27",
  "tenacity>=8.2",
  "chromadb>=0.5",
  "neo4j>=5.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

