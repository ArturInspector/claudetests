[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socratic-cli"
version = "0.1.0"
description = "CLI client for the Socratic learning API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
]

[project.scripts]
socratic = "socratic.main:cli"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["socratic"]

